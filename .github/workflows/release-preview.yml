name: Publish unsigned portable preview
on:
  push:
    branches: [main]
    paths: ['.github/workflows/release-preview.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: portable-preview-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'TorofSkiy/cino-aos-windows-native' && github.event.repository.private == false && github.ref == 'refs/heads/main'
    runs-on: windows-2022
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - name: Verify source and run locked build with behavior tests
        shell: pwsh
        run: |
          ./scripts/Test-Source.ps1 -AllowGitMetadata
          ./scripts/Build.ps1
      - name: Publish reviewed unsigned preview and verify uploaded bytes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/Publish-Preview.ps1 -BuildRoot ./artifacts -SourceCommit $env:GITHUB_SHA -OutputRoot ./preview-release

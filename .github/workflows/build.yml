name: Native core review build
on:
  workflow_dispatch:
    inputs:
      upload_review_artifact:
        description: 'Upload only after verifying free storage and a zero spending budget'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    if: github.event.repository.private == false
    # Standard public-repository runner only; no paid larger runners or self-hosted signing.
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - name: Verify reviewed source
        shell: pwsh
        run: ./scripts/Test-Source.ps1 -AllowGitMetadata
      - name: Build and test without signing or deployment
        shell: pwsh
        run: ./scripts/Build.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: inputs.upload_review_artifact && vars.CINO_FREE_STORAGE_CONFIRMED == 'true'
        with:
          name: cino-native-unsigned-review
          path: |
            artifacts/portable/
            artifacts/build-receipt.json
          if-no-files-found: error
          retention-days: 3

